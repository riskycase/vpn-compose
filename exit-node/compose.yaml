services:
  tailscale-exit:
    image: tailscale/tailscale:latest
    # The name this exit node announces to Headscale. Required, with no default on
    # purpose: every host deploying this stack would otherwise register under the same
    # name, and they'd all need renaming by hand in Headplane.
    hostname: ${EXIT_NODE_HOSTNAME:?set EXIT_NODE_HOSTNAME to this host's exit node name}
    restart: unless-stopped
    # Headscale is a separate stack now, possibly on a different host entirely, so there's
    # no same-file depends_on to wait on it. It just needs to already be up.
    # Logged in once with a pre-auth key; the login lives in the state volume, so no key
    # is kept here. To re-register, add TS_AUTHKEY from the environment for one deploy.
    environment:
      # Passed through from the stack's environment, not set here. A first deploy on a new
      # host needs a Headscale pre-auth key; later ones don't, and the bare form leaves it
      # unset in the container rather than empty when the stack doesn't provide it.
      - TS_AUTHKEY
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # The image's iptables is the legacy backend, which needs kernel modules the host
      # doesn't load; tailscaled's router setup failed without this.
      - TS_DEBUG_FIREWALL_MODE=nftables
      # The public name, not the service name, so the exit node reaches every service on
      # this host the way any client does. Needs the lo trust below and sslh-tproxy.
      - TS_EXTRA_ARGS=--login-server=https://headscale.riskycase.in --advertise-exit-node
    volumes:
      # Relative to this directory, so a fresh host just needs this folder checked out —
      # no coordination with the server stack's absolute paths.
      - ./data/tailscale:/var/lib/tailscale
      # Exit-node clients' DNS is resolved here. Docker's embedded resolver forwards from
      # the host's namespace to the host's own resolvers, out of reach of the WARP
      # routing, so this container talks to its nameservers directly instead.
      - ./resolv.conf:/etc/resolv.conf:ro
    # Reaching Headscale must not need DNS, which only works while WARP is up.
    extra_hosts:
      - "headscale.riskycase.in:57.129.178.243"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      # tailscaled's rp_filter workaround needs this, and /proc/sys is read-only to it.
      - net.ipv4.conf.all.src_valid_mark=1
      # Replies from WARP arrive on wg-warp, which strict reverse-path filtering rejects
      # because the main table routes those sources out eth0.
      - net.ipv4.conf.all.rp_filter=2

  warp:
    build: ./warp
    restart: unless-stopped
    # Shares the exit node's namespace so it can route what arrives on tailscale0. Sysctls
    # for this namespace belong to tailscale-exit; Docker rejects them here.
    network_mode: "service:tailscale-exit"
    depends_on:
      tailscale-exit:
        condition: service_started
        restart: true
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      # WARP account, WireGuard profile and pinned endpoint, created on first start. Holds
      # a private key. Relative, same reasoning as tailscale-exit's state above.
      - ./data/warp:/state
      - ./resolv.conf:/etc/resolv.conf:ro
    healthcheck:
      test: ["CMD", "warp-egress", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    driver_opts:
      # sslh connects to its backends as the client's address; for a client in this
      # network the reply reaches sslh through lo, which Docker otherwise drops.
      com.docker.network.bridge.trusted_host_interfaces: "lo"
